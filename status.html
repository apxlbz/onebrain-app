<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OneBrain — Status</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 30 27H2Z' fill='%232b59d1'/%3E%3C/svg%3E" />
<style>
  :root{--paper:#f6f3f1;--ink:#1f1d1a;--muted:#6f6a61;--lake:#2b59d1;
    --ok:#1a7f4e;--down:#b23b3b;--line:#e4ddd6;
    --serif:"Source Serif 4",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans)}
  main{max-width:680px;margin:8vh auto 12vh;padding:0 24px}
  h1{font:400 34px/1.2 var(--serif);margin:0 0 6px}
  h2{font:600 17px/1.3 var(--sans);margin:34px 0 8px}
  p,li{color:var(--ink);font-size:15.5px}
  .muted{color:var(--muted)}
  a{color:var(--lake)}
  .pill{display:flex;align-items:center;gap:10px;padding:14px 16px;margin-top:18px;
    border:1px solid var(--line);border-radius:10px;background:#fff}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
  .dot.ok{background:var(--ok)}
  .dot.down{background:var(--down)}
  .checked{margin-left:auto;font-size:13px;color:var(--muted)}
  ul.incidents{list-style:none;margin:0;padding:0}
  ul.incidents li{padding:12px 0;border-bottom:1px solid var(--line)}
  ul.incidents li:last-child{border-bottom:none}
  form.subscribe{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  form.subscribe input[type=email]{flex:1;min-width:200px;padding:10px 12px;
    border:1px solid var(--line);border-radius:8px;font-size:15px}
  form.subscribe button{padding:10px 16px;border:none;border-radius:8px;
    background:var(--lake);color:#fff;font-size:15px;cursor:pointer}
  form.subscribe button:hover{opacity:.9}
  [data-msg]{display:block;margin-top:8px;font-size:13.5px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>OneBrain Status</h1>
  <p class="muted">The hosted backend (Supabase/Postgres) that stores and serves your memory.</p>

  <div class="pill">
    <span class="dot" data-dot></span>
    <span data-label>Checking…</span>
    <span class="checked" data-checked></span>
  </div>

  <h2>Incident history</h2>
  <ul class="incidents" data-incidents>
    <li class="muted">Loading…</li>
  </ul>

  <h2>Get notified</h2>
  <p class="muted">Leave your email to hear about incidents as they happen.</p>
  <form class="subscribe" data-subscribe>
    <input type="email" name="email" placeholder="you@company.com" required />
    <button type="submit">Subscribe</button>
    <span data-msg></span>
  </form>
</main>
<script type="module" src="./status.js?v=1"></script>
</body>
</html>

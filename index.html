<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#f6f3f1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 30 27H2Z' fill='%232b59d1'/%3E%3C/svg%3E" />
<title>OneBrain</title>
<meta name="description" content="Your organization's shared memory." />
<style>
  :root{--paper:#f6f3f1;--ink:#1f1d1a;--muted:#6f6a61;--lake:#2b59d1;
    --serif:"Source Serif 4",Georgia,serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans)}
  main{max-width:430px;margin:14vh auto;padding:0 24px;text-align:center}
  .eyebrow{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--lake)}
  h1{font:400 38px/1.15 var(--serif);margin:14px 0 12px;text-wrap:balance}
  p{color:var(--muted);font-size:15px}
  button{font:600 14px var(--sans);background:var(--lake);color:#fff;border:0;border-radius:6px;
    padding:12px 22px;cursor:pointer;margin-top:20px}
  button:focus-visible{outline:2px solid var(--lake);outline-offset:2px}
  .status{font-size:13px;color:var(--muted);min-height:1.2em;margin-top:12px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">OneBrain</p>
  <h1>Your organization's shared&nbsp;memory.</h1>
  <p>Sign in with your work Google account. Everyone on your email domain shares
    one memory; nobody outside it can reach a single row.</p>
  <button id="google">Continue with Google</button>
  <p class="status" id="status"></p>
</main>
<script type="module">
  // Pure entrance: sign in, then route — unfinished org -> the setup wizard,
  // established org -> the dashboard. One app, one look.
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
  const SUPA = "https://epjkzltwyfexiunbmbel.supabase.co";
  const cfg = await fetch(`${SUPA}/functions/v1/api/config`).then((r) => r.json());
  const sb = createClient(cfg.supabase_url, cfg.supabase_anon_key);
  const st = document.getElementById("status");

  async function route() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return false;
    st.textContent = "Signed in — loading…";
    try {
      const { data: ob } = await sb.from("onboarding").select("completed_at").maybeSingle();
      location.replace(ob?.completed_at ? "./app.html" : "./onboard.html");
    } catch {
      location.replace("./app.html");
    }
    return true;
  }

  document.getElementById("google").addEventListener("click", async () => {
    st.textContent = "Redirecting to Google…";
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: location.origin + location.pathname },
    });
    if (error) st.textContent = error.message;
  });

  if (!(await route())) sb.auth.onAuthStateChange((_e, s) => { if (s) route(); });
</script>
</body>
</html>
